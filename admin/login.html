<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PRISM Admin Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/admin.css">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>PRISM</h1>

            <h2>Admin Portal</h2>

            <p>

                Department of Political Science<br>

                K. J. Somaiya College of Arts & Commerce (Autonomous)<br>

                Reaccredited by NAAC with Grade 'A'

            </p>

            <form id="loginForm">

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required>

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required>

                <button type="submit">

                    Login

                </button>

            </form>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/supabase.js"></script>

    <script src="../js/auth.js"></script>

    <script>

        redirectIfLoggedIn();

        document
            .getElementById("loginForm")
            .addEventListener("submit", async function (e) {

                e.preventDefault();

                await login(

                    document.getElementById("email").value,

                    document.getElementById("password").value

                );

            });

    </script>

</body>

</html>
