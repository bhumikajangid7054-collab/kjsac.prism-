<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PRISM Admin Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/admin.css">

</head>

<body>

<div class="admin-layout">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h1>PRISM</h1>

        <p>Admin Panel</p>

        <nav>

            <button class="nav-btn active" data-section="dashboard">

                Dashboard

            </button>

            <button class="nav-btn" data-section="announcements">

                Announcements

            </button>

            <button class="nav-btn" data-section="faculty">

                Faculty

            </button>

            <button class="nav-btn" data-section="datalabs">

                DataLabs

            </button>

            <button class="nav-btn" data-section="events">

                Events

            </button>

            <button class="nav-btn" data-section="newsletters">

                Y.U.V.A.

            </button>

            <button onclick="logout()">

                Logout

            </button>

        </nav>

    </aside>

    <!-- Main Content -->

    <main class="admin-content">

        <!-- Dashboard -->

        <section id="dashboard" class="admin-section">

            <h2>Dashboard</h2>

            <div class="stats-grid">

                <div class="stat-card">

                    <h3>Announcements</h3>

                    <p id="announcementCount">0</p>

                </div>

                <div class="stat-card">

                    <h3>Faculty</h3>

                    <p id="facultyCount">0</p>

                </div>

                <div class="stat-card">

                    <h3>DataLabs</h3>

                    <p id="datalabCount">0</p>

                </div>

                <div class="stat-card">

                    <h3>Events</h3>

                    <p id="eventCount">0</p>

                </div>

                <div class="stat-card">

                    <h3>Newsletters</h3>

                    <p id="newsletterCount">0</p>

                </div>

            </div>

        </section>

        <!-- Announcements -->

        <section id="announcements"

            class="admin-section hidden">

            <h2>Announcements</h2>

            <button id="addAnnouncement">

                Add Announcement

            </button>

            <div id="announcementList"></div>

        </section>

        <!-- Faculty -->

        <section id="faculty"

            class="admin-section hidden">

            <h2>Faculty</h2>

            <button id="addFaculty">

                Add Faculty

            </button>

            <div id="facultyList"></div>

        </section>

        <!-- DataLabs -->

        <section id="datalabs"

            class="admin-section hidden">

            <h2>DataLabs</h2>

            <button id="addDataLab">

                Add DataLab

            </button>

            <div id="datalabList"></div>

        </section>
