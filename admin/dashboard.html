<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PRISM Admin Dashboard</title>

    <link rel="stylesheet"
          href="admin.css">

</head>

<body>

<div class="dashboard-container">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar">

        <h2 class="logo">
            PRISM
        </h2>

        <nav>

            <button class="nav-btn active"
                    data-section="dashboardSection">
                Dashboard
            </button>

            <button class="nav-btn"
                    data-section="facultySection">
                Faculty
            </button>

            <button class="nav-btn"
                    data-section="datalabsSection">
                Data Labs
            </button>

            <button class="nav-btn"
                    data-section="eventsSection">
                Events
            </button>

            <button class="nav-btn"
                    data-section="gallerySection">
                Gallery
            </button>

            <button class="nav-btn"
                    data-section="newslettersSection">
                Newsletters
            </button>

        </nav>

        <button id="logoutBtn"
                class="logout-btn">
            Logout
        </button>

    </aside>

    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="main-content">

        <header class="topbar">

            <h1>
                Admin Dashboard
            </h1>

            <p>
                Welcome to the PRISM Administration Panel
            </p>

        </header>

        <!-- =========================
             DASHBOARD
        ========================== -->

        <section id="dashboardSection"
                 class="content-section active">

            <div class="stats-grid">
                            <div class="stat-card">
                <h3>Total Faculty</h3>
                <h2 id="facultyCount">0</h2>
            </div>

            <div class="stat-card">
                <h3>Data Labs</h3>
                <h2 id="datalabsCount">0</h2>
            </div>

            <div class="stat-card">
                <h3>Events</h3>
                <h2 id="eventsCount">0</h2>
            </div>

            <div class="stat-card">
                <h3>Newsletters</h3>
                <h2 id="newslettersCount">0</h2>
            </div>

            </div>

            <div class="quick-actions">

                <h2>Quick Actions</h2>

                <div class="action-grid">

                    <button id="addFacultyBtn">
                        Add Faculty
                    </button>

                    <button id="addDatalabBtn">
                        Add Data Lab
                    </button>

                    <button id="addEventBtn">
                        Add Event
                    </button>

                    <button id="uploadNewsletterBtn">
                        Upload Newsletter
                    </button>

                    <button id="uploadGalleryBtn">
                        Upload Gallery Images
                    </button>

                </div>

            </div>

        </section>

        <!-- =========================
             FACULTY
        ========================== -->

        <section id="facultySection"
                 class="content-section">

            <h2>Faculty Management</h2>

            <div id="facultyContainer"></div>

        </section>

        <!-- =========================
             DATA LABS
        ========================== -->

        <section id="datalabsSection"
                 class="content-section">

            <h2>Data Labs</h2>

            <div id="datalabsContainer"></div>

        </section>

        <!-- =========================
             EVENTS
        ========================== -->

        <section id="eventsSection"
                 class="content-section">

            <h2>Events</h2>

            <div id="eventsContainer"></div>

        </section>

        <!-- =========================
             GALLERY
        ========================== -->

        <section id="gallerySection"
                 class="content-section">

            <h2>Gallery</h2>

            <div id="galleryContainer"></div>

        </section>

        <!-- =========================
             NEWSLETTERS
        ========================== -->

        <section id="newslettersSection"
                 class="content-section">

            <h2>Newsletters</h2>

            <div id="newslettersContainer"></div>

        </section>
            </main>

</div>

<!-- =========================
     LOADER
========================= -->

<div id="loader" class="hidden"></div>

<!-- =========================
     TOAST CONTAINER
========================= -->

<div id="toastContainer"></div>

<!-- =========================
     JAVASCRIPT
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/faculty.js"></script>
<script src="js/datalabs.js"></script>
<script src="js/events.js"></script>
<script src="js/gallery.js"></script>
<script src="js/newsletters.js"></script>

</body>

</html>
