<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PRISM Admin Dashboard</title>

    <link rel="stylesheet" href="admin.css">

</head>

<body data-page="dashboard">

<div class="dashboard">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar">

        <div class="sidebar-logo">

            <h2>PRISM</h2>

            <p>Admin Panel</p>

        </div>

        <nav class="sidebar-nav">

            <button class="nav-btn active"
                    data-section="dashboard">

                📊 Dashboard

            </button>

            <button class="nav-btn"
                    data-section="faculty">

                👨‍🏫 Faculty

            </button>

            <button class="nav-btn"
                    data-section="datalabs">

                📚 DataLabs

            </button>

            <button class="nav-btn"
                    data-section="events">

                🎉 Events

            </button>

            <button class="nav-btn"
                    data-section="gallery">

                🖼 Gallery

            </button>

            <button class="nav-btn"
                    data-section="newsletters">

                📰 Newsletters

            </button>

        </nav>

        <button id="logoutBtn"
                class="logout-btn">

            Logout

        </button>

    </aside>

    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="main-content">

        <header class="topbar">

            <div>

                <h1 id="pageTitle">

                    Dashboard

                </h1>

                <p>

                    Welcome to PRISM Admin

                </p>

            </div>

        </header>

        <section id="dashboardSection"
                 class="content-section active">

            <div class="stats-grid">

                        <div class="stat-card">

                <h3>Total Faculty</h3>

                <span id="facultyCount">0</span>

            </div>

            <div class="stat-card">

                <h3>Total DataLabs</h3>

                <span id="datalabsCount">0</span>

            </div>

            <div class="stat-card">

                <h3>Total Events</h3>

                <span id="eventsCount">0</span>

            </div>

            <div class="stat-card">

                <h3>Total Newsletters</h3>

                <span id="newslettersCount">0</span>

            </div>

        </div>

        <div class="dashboard-card">

            <h2>

                Quick Actions

            </h2>

            <div class="quick-actions">

                <button class="action-btn"
                        data-section="faculty">

                    + Add Faculty

                </button>

                <button class="action-btn"
                        data-section="events">

                    + Add Event

                </button>

                <button class="action-btn"
                        data-section="gallery">

                    + Upload Images

                </button>

                <button class="action-btn"
                        data-section="newsletters">

                    + Upload Newsletter

                </button>

            </div>

        </div>

        </section>

        <!-- =========================
             FACULTY
        ========================== -->

        <section id="facultySection"
                 class="content-section">

        </section>

        <!-- =========================
             DATALABS
        ========================== -->

        <section id="datalabsSection"
                 class="content-section">

        </section>

        <!-- =========================
             EVENTS
        ========================== -->

        <section id="eventsSection"
                 class="content-section">

        </section>

        <!-- =========================
             GALLERY
        ========================== -->

        <section id="gallerySection"
                 class="content-section">

        </section>

        <!-- =========================
             NEWSLETTERS
        ========================== -->

        <section id="newslettersSection"
                 class="content-section">
                    </section>

    </main>

</div>

<!-- =========================
     LOADER
========================= -->

<div id="loader" class="hidden"></div>

<!-- =========================
     TOASTS
========================= -->

<div id="toastContainer"></div>

<!-- =========================
     SCRIPTS
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>

<script src="js/auth.js"></script>

<script src="js/ui.js"></script>

<script src="js/dashboard.js"></script>

<script src="js/faculty.js"></script>

<script src="js/datalabs.js"></script>

<script src="js/events.js"></script>

<script src="js/gallery.js"></script>

<script src="js/newsletters.js"></script>

</body>
</html>
